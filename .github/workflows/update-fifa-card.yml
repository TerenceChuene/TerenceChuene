name: Update FIFA card

# Re-scouts GitFut whenever this repo changes, on a timer (catches activity
# elsewhere), or when you run it manually from the Actions tab.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  schedule:
    # Every 4 hours — picks up commits/PRs from other repos
    - cron: "0 */4 * * *"
  workflow_dispatch:
  # Optional: other repos can POST repository_dispatch to refresh sooner
  repository_dispatch:
    types: [github-activity]

permissions:
  contents: write

concurrency:
  group: update-fifa-card
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Re-scout card + rewrite README
        env:
          GITHUB_USERNAME: TerenceChuene
        run: node scripts/update-profile.mjs

      - name: Commit if the card changed
        run: |
          if git diff --quiet README.md; then
            echo "Card already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: refresh GitFut FIFA card from latest activity"
          git push
