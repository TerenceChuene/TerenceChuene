name: Update FIFA card

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "assets/scout-report.png"
      - "assets/fifa-card.png"
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [github-activity]

permissions:
  contents: write

concurrency:
  group: update-fifa-card
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow

      - name: Re-scout card + rebuild dashboard
        env:
          GITHUB_USERNAME: TerenceChuene
          GITFUT_COUNTRY: ZA
        run: node scripts/update-profile.mjs

      - name: Commit if the card changed
        run: |
          if git diff --quiet README.md assets/scout-report.png assets/fifa-card.png 2>/dev/null; then
            echo "Card already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/scout-report.png assets/fifa-card.png
          git commit -m "chore: refresh GitFut FIFA scout dashboard"
          git push
